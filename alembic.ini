# Alembic configuration.
# The actual database URL is supplied at runtime from the DATABASE_URL
# environment variable (or OneStopSettings) via migrations/env.py.
# The sqlalchemy.url here is a structural placeholder; env.py always overrides it.

[alembic]
script_location = migrations
# Placeholder URL; env.py reads the real value from OneStopSettings / DATABASE_URL.
sqlalchemy.url = postgresql+psycopg://localhost/placeholder
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
prepend_sys_path = .

[post_write_hooks]
# hooks =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
