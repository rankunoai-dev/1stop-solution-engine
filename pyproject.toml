[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "onestop"
version = "0.1.0"
description = "RankUno 1Stop: one knowledge base about every RankUno in-house tool, answered with hybrid RAG."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "RankUno AI Automation" }]

# Runtime dependencies are added in the slice that first uses them
# (docs/IMPLEMENTATION_PLAN_R0_R1.md), so each addition is reviewed with its code.
dependencies = [
    "pydantic[email]>=2.7,<3.0",  # [email] extra adds email-validator for EmailStr (R0.8)
    "pydantic-settings>=2.3,<3.0",
    "tenacity>=8.3",
    # R0.4 – database layer
    "sqlalchemy[asyncio]>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",  # async test functions and fixtures
    # Exact pins so local, pre-commit and CI results are identical.
    "ruff==0.16.9",
    "mypy==2.3.1",
    "import-linter>=2.1",
    "pre-commit>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Lint / format: copied from project-standards so both repos read the same.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Code blocks in docs/ are illustrative and deliberately compact.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP",
    "ANN",   # strict typing standard
    "S",     # bandit security checks
    "T20",   # no print(); use the structured logger
    "RET", "SIM", "C4",
    "D",     # docstrings
]
ignore = ["D203", "D213", "ANN401"]

[tool.ruff.lint.per-file-ignores]
# Tests document themselves through their names; docstring and annotation
# rules are relaxed there (as in prompt-engine).
"tests/**" = ["S101", "S105", "S106", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
# `src` is itself a package (imports read `src.core.x`), so declare it first-party.
known-first-party = ["src", "tests"]

# ---------------------------------------------------------------------------
# Type checking: strict on src/, relaxed on tests/.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Inward-only dependency rule (Step 2 standard): modules -> integrations -> core.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "src"

[[tool.importlinter.contracts]]
name = "Inward-only dependencies: modules -> integrations -> core"
type = "layers"
layers = ["src.modules", "src.integrations", "src.core"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: touches a real external service (excluded from CI)",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Governance floor. Raise as the codebase matures; never lower it.
fail_under = 85
