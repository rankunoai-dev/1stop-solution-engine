name: CI

# SDLC Step 7 enforced in CI. Mirrors scripts/verify.ps1; if they diverge,
# fix both in the same commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Format, lint, layers, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - name: Dependency layers (modules -> integrations -> core)
        run: lint-imports

      - name: Type check (strict)
        run: mypy src

      - name: Tests
        # No credentials reach this job. External services are faked; tests that
        # need a real service are marked `integration` and excluded here.
        run: pytest --cov=src --cov-report=term-missing -m "not integration"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.18.4"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf "$archive" gitleaks

      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose
